  #   mode: scraper
  #   name: "Groupe X @ Bataclan"
  #   url: "https://www.bataclan.fr/event/xxx"
  #   method: keywords
  #   selector: ".event-tickets"      # optionnel : CSS selector de la zone à surveiller
  #   keywords_available: ["Acheter", "Réserver", "Buy tickets"]
  #   keywords_soldout:  ["Complet", "Sold out", "Épuisé"]

