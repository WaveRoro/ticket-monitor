# Configuration centralisée des événements surveillés.
# Deux modes : "ticketmaster" (API officielle) ou "scraper" (page publique).
#
# NOTE : la Discovery API Ticketmaster n'a essentiellement PAS de couverture
# de la France. Pour les events fr, utilise le mode scraper sur livenation.fr
# (accessible) plutôt que ticketmaster.fr (bloqué par anti-bot).

events:
  # === Don Toliver - Accor Arena, Paris (via Live Nation FR) ===
  - id: don_toliver_paris_2026_10_25
    mode: scraper
    name: "Don Toliver — Accor Arena Paris, 25 oct. 2026"
    url: "https://www.livenation.fr/event/don-toliver-nitrous-octane-world-tour-leg-2-paris-tickets-edp1680526"
    method: keywords
    keywords_available:
      - "Acheter"
      - "Trouver des billets"
      - "Réserver"
    keywords_soldout:
      - "Complet"
      - "Épuisé"
      - "Sold out"

  # --- Gabarit pour ajouter un site avec mots-clés ---
