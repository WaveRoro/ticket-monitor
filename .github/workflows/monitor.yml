name: Ticket monitor

on:
  schedule:
    # Toutes les 5 minutes (repo public → GitHub Actions illimité gratuit).
    # NB : GitHub cron est "best effort", des retards de quelques minutes sont normaux en heure de pointe.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permet un run manuel depuis l'onglet Actions

# Nécessaire pour committer state.json en retour sur le repo.
permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Commit state changes
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore(state): update monitor state [skip ci]"
            git push
          else
            echo "no state change"
          fi
